[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexprice"
version = "0.1.0"
description = "Find the best price across sites and expose fake discounts through real price history, over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThiagoVenturim" }]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nexprice = "nexprice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexprice"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S603", "S607", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
